[project]
name = "ai-military-intelligence-dashboard"
version = "1.0.0"
description = "AI-Based Military Intelligence and Threat Analysis Dashboard (Historical Analytics)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shubham Kumar", email = "yshubham0103@gmail.com" }
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module level import not at top of file (used in scripts with sys.path)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
